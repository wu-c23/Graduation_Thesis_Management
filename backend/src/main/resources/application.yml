server:
  port: 8080

spring:
  application:
    name: thesis-platform
  datasource:
    url: jdbc:h2:file:./data/thesisdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    # 开发默认值仅用于本地演示；生产/答辩部署请通过 JWT_SECRET 环境变量覆盖。
    secret: ${JWT_SECRET:thesis-platform-dev-secret-key-2026-change-me}
    expiration-minutes: 480

logging:
  level:
    com.example.thesis: info
