spring:
  datasource:
    url: jdbc:h2:mem:thesis_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: false

app:
  upload:
    dir: ./target/test-uploads
    # 测试环境使用较小上限，避免创建 20MB 文件
    max-size-bytes: 1024
